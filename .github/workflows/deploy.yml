name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Next 14 빌드 내장 lint는 ESLint 9 flat config를 인식 못 해 껐다
      # (next.config.mjs ignoreDuringBuilds) — 대신 여기서 lint 게이트 유지
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # 온라인 멀티플레이 (Supabase). publishable/anon key는 클라이언트 번들에
          # 어차피 포함되는 공개 전제 키 — 접근 제어는 RLS가 담당 (docs/online-multiplayer-plan.md §3)
          NEXT_PUBLIC_SUPABASE_URL: https://gklxcdgumdzgvltuyxjl.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_sJiHGhjH_qy_TR8S1Bvh6A_gVAZUfZY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
